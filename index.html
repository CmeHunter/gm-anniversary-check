<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>週年慶活動設定檢查</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6675; --line:#e3e6eb;
  --err:#c62828; --err-bg:#fdecec; --miss:#8a5a00; --miss-bg:#fff4dc; --warn:#9a6700; --warn-bg:#fff9db;
  --ok:#1b7f4b; --ok-bg:#e6f6ec; --info:#3550b0; --info-bg:#eaf0ff; --accent:#22305a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --card:#1b1f27; --text:#e6e9ef; --muted:#9aa3b2; --line:#2c323d;
    --err:#ff8a80; --err-bg:#3a1c1c; --miss:#ffcc66; --miss-bg:#3a2e14; --warn:#ffe082; --warn-bg:#33301a;
    --ok:#7ddc9f; --ok-bg:#16301f; --info:#9db4ff; --info-bg:#1d2540; --accent:#c9d4ff;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b; --card:#1b1f27; --text:#e6e9ef; --muted:#9aa3b2; --line:#2c323d;
  --err:#ff8a80; --err-bg:#3a1c1c; --miss:#ffcc66; --miss-bg:#3a2e14; --warn:#ffe082; --warn-bg:#33301a;
  --ok:#7ddc9f; --ok-bg:#16301f; --info:#9db4ff; --info-bg:#1d2540; --accent:#c9d4ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.55;font-size:15px}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
header h1{font-size:1.35rem;margin:0 0 4px;color:var(--accent)}
.meta{color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 16px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;font-size:.85rem;color:var(--muted)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.b-error{background:var(--err-bg);color:var(--err)} .b-missing{background:var(--miss-bg);color:var(--miss)}
.b-warn{background:var(--warn-bg);color:var(--warn)} .b-ok{background:var(--ok-bg);color:var(--ok)}
.b-info{background:var(--info-bg);color:var(--info)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.store{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;display:block;transition:border-color .15s}
.store:hover,.store:focus-visible{border-color:var(--accent);outline:none}
.store h2{margin:0 0 10px;font-size:1.1rem}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.nums div{border-radius:8px;padding:6px 0}
.nums b{display:block;font-size:1.35rem;line-height:1.2}
.nums span{font-size:.75rem}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:12px;background:var(--line)}
.bar i{display:block}
.store .foot{margin-top:8px;font-size:.82rem;color:var(--muted)}
.back{display:inline-block;margin:4px 0 10px;text-decoration:none;color:var(--muted)}
.back:hover{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.row{background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row.s-error{border-left-color:var(--err)} .row.s-missing{border-left-color:var(--miss)}
.row.s-warn{border-left-color:var(--warn)} .row.s-ok{border-left-color:var(--ok)}
.row h3{margin:0;font-size:1rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.evs{margin:8px 0 0;padding:0;list-style:none;font-size:.85rem}
.evs li{padding:2px 0;color:var(--muted)}
.evs code{font-family:Consolas,monospace;color:var(--text)}
.iss{margin:8px 0 0;padding-left:0;list-style:none}
.iss li{padding:3px 0 3px 0;font-size:.9rem;display:flex;gap:8px;align-items:baseline}
.iss li .badge{flex:none}
.note{margin-top:6px;font-size:.85rem;color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:18px;font-size:.88rem;color:var(--muted)}
.box ul{margin:6px 0 0;padding-left:20px}
.empty{color:var(--muted);padding:20px;text-align:center}
#lock{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
#lock h1{font-size:1.15rem;margin:0 0 6px}
#lock p{color:var(--muted);font-size:.9rem;margin:0 0 14px}
#lock input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
#lock button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
#lock .msg{color:var(--err);font-size:.85rem;min-height:1.3em;margin-top:8px}
.hidden{display:none}
@media (max-width:560px){ .nums b{font-size:1.15rem} .row{padding:10px 12px} }
</style>
</head>
<body>
<form id="lock" autocomplete="off">
  <h1>週年慶活動設定檢查</h1>
  <p>本頁內容已加密，請輸入總部提供的密碼。</p>
  <label for="pw" class="hidden">密碼</label>
  <input id="pw" type="password" placeholder="密碼" autofocus>
  <button type="submit">查看</button>
  <div class="msg" id="lockmsg" role="alert"></div>
</form>
<div class="wrap hidden" id="app"></div>

const LABEL = {error:"設定錯誤", missing:"未設定", warn:"需確認", ok:"設定正確", info:"提示"};
let DATA = null;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_NAME = "gmac_key_" + PAYLOAD.salt;  // 記住的是本版資料的解密金鑰（不是密碼），每天更新後自動失效
async function deriveKey(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptWith(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function badge(level, text){ return `<span class="badge b-${level}">${esc(text ?? LABEL[level])}</span>`; }

function overview(){
  const d = DATA;
  let h = `<header><h1>${esc(d.title)}</h1><div class="meta"><span>最後檢查：${esc(d.checked_at)}</span><span>設定截止：${esc(d.deadline)}</span><span>每日 23:30 自動更新</span></div></header>`;
  h += `<div class="legend">${["error","missing","warn","ok"].map(k => badge(k)).join("")}<span>點分店看活動明細</span></div><div class="grid">`;
  for (const s of d.stores){
    const c = s.counts, tot = c.error + c.missing + c.warn + c.ok || 1;
    const seg = k => `<i style="width:${c[k]/tot*100}%;background:var(--${{error:"err",missing:"miss",warn:"warn",ok:"ok"}[k]})"></i>`;
    h += `<a class="store" href="#${esc(s.code)}"><h2>${esc(s.name)}</h2><div class="nums">
      <div class="b-error"><b>${c.error}</b><span>設定錯誤</span></div>
      <div class="b-missing"><b>${c.missing}</b><span>未設定</span></div>
      <div class="b-warn"><b>${c.warn}</b><span>需確認</span></div>
      <div class="b-ok"><b>${c.ok}</b><span>設定正確</span></div></div>
      <div class="bar">${seg("error")}${seg("missing")}${seg("warn")}${seg("ok")}</div>
      <div class="foot">共 ${tot} 項・待審核／草稿活動 ${s.pending} 筆</div></a>`;
  }
  h += `</div><div class="box"><b>說明</b><ul>
    <li><b>設定錯誤</b>：系統已建立，但設定會造成會員拿不到、提早拿到或券不能用，請優先修正。</li>
    <li><b>未設定</b>：DM 有列出，系統還找不到對應活動。若活動名稱和 DM 差很多，也可能被判斷為未設定。</li>
    <li><b>需確認</b>：和 DM 不完全一致或有風險，請確認後決定是否調整。</li>
    <li>活動「待審核」或「草稿」時尚未生效，10/22 前請完成送審與審核。</li>
    <li>比對來源：各店週年慶 DM 與系統活動設定（含尚未審核的版本）。有疑問請洽總部資訊部。</li></ul></div>`;
  return h;
}
let filter = "all";
function detail(code){
  const s = DATA.stores.find(x => x.code === code);
  if (!s) return overview();
  const rows = s.rows.filter(r => filter === "all" || r.status === filter);
  let h = `<a class="back" href="#">← 回到所有分店</a><header><h1>${esc(s.name)}</h1><div class="meta"><span>最後檢查：${esc(DATA.checked_at)}</span><span>DM：${esc(s.dm)}</span></div></header>`;
  h += `<div class="chips" role="group" aria-label="篩選狀態">` + ["all","error","missing","warn","ok"].map(k =>
    `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${k==="all"?"全部":LABEL[k]}（${k==="all"?s.rows.length:s.counts[k]}）</button>`).join("") + `</div>`;
  if (!rows.length) h += `<div class="empty">沒有符合的項目</div>`;
  for (const r of rows){
    h += `<article class="row s-${r.status}"><h3>${badge(r.status)}<span>${esc(r.name)}</span></h3>
      <div class="sub">${esc(r.group)}・${esc(r.period_label || "DM 期間")} ${esc(r.period)}</div>`;
    if (r.events.length) h += `<ul class="evs">` + r.events.map(e => `<li><code>${esc(e.id)}</code> ${esc(e.name)} ${e.s?`（${esc(e.s)}～${esc(e.c)}）`:""} ${e.approval?badge(e.approval==="已核准"?"ok":e.approval==="已駁回"?"error":"info", e.approval):""}</li>`).join("") + `</ul>`;
    const iss = r.issues.filter(i => i.level !== "missing");
    if (iss.length) h += `<ul class="iss">` + iss.map(i => `<li>${badge(i.level)}<span>${esc(i.msg)}</span></li>`).join("") + `</ul>`;
    if (r.note) h += `<div class="note">備註：${esc(r.note)}</div>`;
    h += `</article>`;
  }
  if (s.not_checked.length) h += `<div class="box"><b>DM 上有、但不在本頁檢查範圍</b><ul>${s.not_checked.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  return h;
}
function render(){
  let code = "";
  try { code = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  document.getElementById("app").innerHTML = code ? detail(code) : overview();
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  if (code) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { filter = "all"; if (DATA) render(); });

function show(){
  document.getElementById("lock").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  render();
}
async function unlock(pw){
  const msg = document.getElementById("lockmsg");
  msg.textContent = "解密中…";
  try {
    const key = await deriveKey(pw);
    DATA = await decryptWith(key);
    try {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      sessionStorage.setItem(KEY_NAME, btoa(String.fromCharCode(...raw)));
    } catch (e) {}
    show();
  } catch (e) {
    msg.textContent = "密碼不正確";
  }
}
document.getElementById("lock").addEventListener("submit", ev => { ev.preventDefault(); unlock(document.getElementById("pw").value); });
(async () => {
  try {
    const saved = sessionStorage.getItem(KEY_NAME);
    if (!saved) return;
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
    DATA = await decryptWith(key);
    show();
  } catch (e) {}
})();
</script>
